name: HoldVue CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Offline gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate

  package:
    name: Unsigned ${{ matrix.platform }} package
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-x64
            os: macos-15-intel
            command: npm run package:mac:x64
          - platform: macOS-arm64
            os: macos-14
            command: npm run package:mac:arm64
          - platform: Windows-x64
            os: windows-latest
            command: npm run package:win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - name: Upload unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: holdvue-${{ matrix.platform }}-unsigned
          path: release/*
          if-no-files-found: error
